# Local development: docker compose up -d  →  API http://localhost:8010, PostgreSQL localhost:5433
name: kuryer-net
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    # Windows bind mounts are root-owned; php-fpm workers (www-data) need write access to these two folders.
    command: sh -c "chmod -R ugo+rwX storage bootstrap/cache && exec php-fpm"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.29-alpine
    ports:
      - "${APP_PORT:-8010}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: postgres:18-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-kuryer}
      POSTGRES_USER: ${DB_USERNAME:-kuryer}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      TZ: Asia/Baku
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vendor:
  pgdata:
